# Logstash pipeline for ChannelMix API structured JSON request logs.
#
# The API writes one JSON object per line to stdout, e.g.
#   {"@timestamp":"...","level":"INFO","logger":"channelmix.request","message":"request",
#    "request_id":"...","method":"GET","path":"/api/v1/accounts/1/reports/trend",
#    "status":200,"account_id":1,"latency_ms":12.4,"client":"172.18.0.1","service":"channelmix-api"}
#
# docker-compose ships the api container's stdout here via the gelf log driver (input 1);
# the tcp input (2) lets you `uvicorn ... | nc logstash 5000` outside Docker.

input {
  gelf {
    port => 12201
    type => "docker"
  }
  tcp {
    port  => 5000
    codec => json_lines
    type  => "raw"
  }
}

filter {
  # gelf wraps the application line in "message"; unwrap it when it is JSON
  if [type] == "docker" and [message] =~ /^\{/ {
    json {
      source => "message"
      target => "app"
      skip_on_invalid_json => true
    }
    if [app] {
      mutate {
        rename => {
          "[app][request_id]" => "request_id"
          "[app][account_id]" => "account_id"
          "[app][latency_ms]" => "latency_ms"
          "[app][method]"     => "http_method"
          "[app][path]"       => "http_path"
          "[app][status]"     => "http_status"
          "[app][level]"      => "level"
          "[app][logger]"     => "logger"
          "[app][service]"    => "service"
        }
        remove_field => ["app", "message"]
      }
    }
  }

  if [logger] == "channelmix.request" {
    mutate {
      convert => { "latency_ms" => "float" "http_status" => "integer" "account_id" => "integer" }
    }
    # bucket latency so Kibana can build a quick SLO bar chart
    if [latency_ms] {
      ruby {
        code => "
          ms = event.get('latency_ms').to_f
          event.set('latency_bucket', ms < 50 ? 'fast(<50ms)' : ms < 250 ? 'ok(<250ms)' : 'slow(>=250ms)')
        "
      }
    }
    # route family for per-endpoint dashboards (strip numeric ids)
    if [http_path] {
      mutate { add_field => { "route" => "%{http_path}" } }
      mutate { gsub => [ "route", "/\d+", "/{id}" ] }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "channelmix-api-%{+YYYY.MM.dd}"
  }
  # stdout { codec => rubydebug }   # uncomment while debugging the pipeline
}
