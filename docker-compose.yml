name: channelmix

services:
  api:
    build: ./api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://channelmix:channelmix@postgres:5432/channelmix
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: "300"
      LOG_LEVEL: INFO
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: channelmix-api

  web:
    image: node:20-alpine
    working_dir: /web
    volumes: ["./web:/web"]
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: channelmix
      POSTGRES_PASSWORD: channelmix
      POSTGRES_DB: channelmix
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U channelmix"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: ["esdata:/usr/share/elasticsearch/data"]

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    volumes: ["./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"]
    ports: ["12201:12201/udp", "5000:5000"]
    depends_on: [elasticsearch]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on: [elasticsearch]

volumes:
  pgdata:
  esdata:
