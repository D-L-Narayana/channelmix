[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channelmix-api"
version = "1.0.0"
description = "ChannelMix API: unified cross-channel ad spend, reports and budget reallocation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "redis>=5",
  "pydantic>=2",
  "pydantic-settings>=2",
  "python-json-logger>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-bdd>=7", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP017", "UP042"]  # B008: FastAPI Depends() style; UP017/042: keep 3.11 compat
