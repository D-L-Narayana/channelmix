[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channelmix-api"
version = "2.0.0"
description = "ChannelMix API: multi-tenant cross-channel ad performance, CSV/REST ingestion, reports, budget reallocation, SSE"
requires-python = ">=3.12"
# keep in sync with requirements.txt (Vercel / Docker install from that file)
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.0.55",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "email-validator==2.3.0",
  "python-multipart==0.0.32",
  "python-json-logger==4.2.0",
  "redis==8.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-bdd>=7", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.datasets" = ["*.csv", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/features"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP017", "UP042"]  # B008: FastAPI Depends() style
